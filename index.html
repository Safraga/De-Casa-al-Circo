<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>JUEGO DE LA OCA</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #e74c3c;
            --text: #ecf0f1;
            --gold: #f1c40f;
            
            /* Variables para tamaño del dado (Responsive via CSS y JS) */
            --dice-size: 14vmin;
            --dice-half: 7vmin;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; -webkit-tap-highlight-color: transparent; text-transform: uppercase; }
        
        body {
            background-color: var(--primary);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* --- PANTALLA DE INICIO --- */
        #start-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--primary); z-index: 300;
            display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px;
            text-align: center;
        }

        .logo-img {
            max-width: 80%;
            max-height: 40vh;
            margin-bottom: 40px;
            filter: drop-shadow(0 0 20px rgba(241, 196, 15, 0.3));
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .btn-beautiful {
            padding: 15px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #2c3e50;
            background: linear-gradient(135deg, #f1c40f 0%, #f39c12 100%);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 0 #d35400, 0 15px 20px rgba(0,0,0,0.4);
            transition: transform 0.1s, box-shadow 0.1s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-beautiful:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 #d35400, 0 5px 10px rgba(0,0,0,0.4);
        }

        /* --- PANTALLA DE CONFIGURACIÓN --- */
        #setup-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--primary); z-index: 200;
            display: none; 
            flex-direction: column; align-items: center; padding: 20px;
            overflow-y: auto;
        }

        .setup-container { 
            width: 100%; 
            max-width: 500px; 
            margin-bottom: 20px;
        }

        h1 { color: var(--gold); text-align: center; margin-bottom: 10px; font-size: 1.8rem; text-shadow: 2px 2px 0px #000; }
        
        .setup-headers {
            display: flex;
            width: 100%;
            max-width: 500px;
            margin-bottom: 5px;
            color: #bdc3c7;
            font-size: 0.9rem;
            font-weight: bold;
            padding: 0 10px;
        }
        .header-name { flex: 1; text-align: left; }
        .header-emoji { width: 50px; text-align: center; }
        .header-bot { width: 80px; text-align: center; }

        .player-config {
            background: rgba(255,255,255,0.1);
            margin-bottom: 10px; padding: 10px; border-radius: 8px;
            display: flex; align-items: center; gap: 10px;
            flex-wrap: wrap;
        }
        
        .player-name-input {
            flex: 1; padding: 10px; border-radius: 4px; border: none; 
            background: rgba(255,255,255,0.2); color: white; font-weight: bold;
            min-width: 100px;
        }
        
        .emoji-btn { 
            font-size: 1.5rem; background: none; border: none; cursor: pointer; padding: 5px; 
            position: relative; z-index: 5; width: 45px; text-align: center;
        }
        
        .bot-toggle {
            background: #e74c3c; color: white; border: none; padding: 8px 10px;
            border-radius: 20px; cursor: pointer; font-size: 0.7rem;
            width: 80px; text-align: center;
        }
        .bot-toggle.active { background: #27ae60; } 

        .player-select-container {
            margin-bottom: 30px;
            text-align: center;
            width: 100%;
            max-width: 300px;
        }
        .player-select {
            width: 100%; text-align: center; padding: 12px; border-radius: 50px; border:none; background:white; font-weight: bold; font-size: 1rem;
        }

        /* --- JUEGO --- */
        #game-screen { 
            display: none; 
            width: 100%; 
            height: 100%; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            position: relative; 
            z-index: 10; 
        }
        
        .fullscreen-btn, .bgm-btn {
            position: absolute; top: 10px; z-index: 100;
            background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.4);
            color: white; padding: 8px 12px; border-radius: 20px; cursor: pointer; font-size: 0.9rem;
        }
        .bgm-btn { right: auto; left: 10px; }
        .fullscreen-btn { right: 10px; }

        /* TABLERO */
        .board-wrapper {
            position: relative;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 1;
        }

        #board-camera {
            width: 100%;
            height: 100%;
            transform-origin: center center;
            transform: scale(1) translate(0px, 0px);
            transition: transform 0.3s linear; 
            position: absolute;
            top: 0; left: 0;
            z-index: 1;
        }

        #board-image {
            width: 100%;
            height: 100%;
            display: none; 
            object-fit: fill; 
        }

        .placeholder-text {
            color: #ccc; text-align: center; padding: 50px;
            cursor: pointer; border: 2px dashed #555; margin: 20px;
            z-index: 10; 
            position: relative; 
            display: none;
        }

        .floating-ui {
            position: absolute;
            z-index: 60; 
            display: none; 
            flex-direction: column; 
            align-items: center; 
            gap: 15px; 
            transform: translate(-50%, -50%);
            transition: opacity 0.3s ease, visibility 0.3s;
            visibility: visible;
            opacity: 1;
        }

        /* --- DADO 3D MEJORADO --- */
        .scene {
            width: var(--dice-size);
            height: var(--dice-size);
            perspective: 600px;
            color-scheme: light; /* Intento de forzar claro */
        }

        .cube {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            /* Usamos variable para que cambie con media query */
            transform: translateZ(calc(var(--dice-half) * -1)); 
            transition: transform 3s cubic-bezier(0.15, 0.5, 0.25, 1);
        }

        .cube__face {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: white !important; /* Forzado Blanco */
            border: 2px solid #ccc;
            border-radius: 20%;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
            padding: 10%;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.1);
        }

        .dot {
            width: 30%; /* Puntos más grandes (era 20%) */
            height: 30%;
            background-color: black !important; /* Forzado Negro */
            border-radius: 50%;
            justify-self: center;
            align-self: center;
            box-shadow: inset 1px 1px 2px rgba(0,0,0,0.5);
        }

        /* Rotaciones con variable CSS */
        .cube__face--1  { transform: rotateY(  0deg) translateZ(var(--dice-half)); }
        .cube__face--2  { transform: rotateY( 90deg) translateZ(var(--dice-half)); }
        .cube__face--3  { transform: rotateY(180deg) translateZ(var(--dice-half)); }
        .cube__face--4  { transform: rotateY(-90deg) translateZ(var(--dice-half)); }
        .cube__face--5  { transform: rotateX( 90deg) translateZ(var(--dice-half)); }
        .cube__face--6  { transform: rotateX(-90deg) translateZ(var(--dice-half)); }

        /* Posicionamiento de puntos */
        .cube__face--1 .dot { grid-area: 2 / 2; }
        .cube__face--2 .dot:nth-child(1) { grid-area: 1 / 1; } .cube__face--2 .dot:nth-child(2) { grid-area: 3 / 3; }
        .cube__face--3 .dot:nth-child(1) { grid-area: 1 / 1; } .cube__face--3 .dot:nth-child(2) { grid-area: 2 / 2; } .cube__face--3 .dot:nth-child(3) { grid-area: 3 / 3; }
        .cube__face--4 .dot:nth-child(1) { grid-area: 1 / 1; } .cube__face--4 .dot:nth-child(2) { grid-area: 1 / 3; } .cube__face--4 .dot:nth-child(3) { grid-area: 3 / 1; } .cube__face--4 .dot:nth-child(4) { grid-area: 3 / 3; }
        .cube__face--5 .dot:nth-child(1) { grid-area: 1 / 1; } .cube__face--5 .dot:nth-child(2) { grid-area: 1 / 3; } .cube__face--5 .dot:nth-child(3) { grid-area: 2 / 2; } .cube__face--5 .dot:nth-child(4) { grid-area: 3 / 1; } .cube__face--5 .dot:nth-child(5) { grid-area: 3 / 3; }
        .cube__face--6 .dot:nth-child(1) { grid-area: 1 / 1; } .cube__face--6 .dot:nth-child(2) { grid-area: 1 / 3; } .cube__face--6 .dot:nth-child(3) { grid-area: 2 / 1; } .cube__face--6 .dot:nth-child(4) { grid-area: 2 / 3; } .cube__face--6 .dot:nth-child(5) { grid-area: 3 / 1; } .cube__face--6 .dot:nth-child(6) { grid-area: 3 / 3; }

        /* --- BURBUJA DE CONTROLES --- */
        .controls-bubble {
            background: rgba(255,255,255, 0.15);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.3);
            padding: 5px 10px;
            border-radius: 35px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .current-player-emoji {
            font-size: 1.8rem;
            background: white;
            color: black;
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            border: 2px solid #ccc;
        }

        .btn-roll-float {
            pointer-events: auto; 
            z-index: 70; 
            padding: 8px 25px; 
            font-size: 1rem; 
            font-weight: bold;
            border-radius: 25px; 
            border: none;
            background: var(--accent); 
            color: white; 
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            transition: transform 0.1s, background 0.2s;
        }
        .btn-roll-float:hover { background: #c0392b; }
        .btn-roll-float:disabled { background: #7f8c8d; cursor: not-allowed; opacity: 0.7; }
        .btn-roll-float:active { transform: scale(0.95); }

        /* FICHAS */
        .token {
            width: 3.3%; height: 3.3%; 
            position: absolute;
            font-size: 1.4rem; 
            text-align: center;
            line-height: 100%;
            transform: translate(-50%, -50%);
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 50; 
            display: none;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.5));
        }
        .token.frozen { transition: none !important; }
        .token.finished { opacity: 0.4; filter: grayscale(100%); }

        .bottom-panel { display: none !important; } 
        
        /* MODAL */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 9999 !important;
            display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .modal-overlay.show { opacity: 1; pointer-events: all; }
        .modal-content {
            background: white; color: #333; padding: 25px; border-radius: 12px;
            width: 90%; max-width: 450px; text-align: center;
            max-height: 85vh; overflow-y: auto;
            box-shadow: 0 0 25px rgba(0,0,0,0.5);
            text-transform: uppercase;
            z-index: 10000;
        }
        .modal-title { color: var(--accent); margin-bottom: 15px; font-size: 1.6rem; }
        .modal-text { font-size: 1.1rem; line-height: 1.6; margin-bottom: 20px; text-align: left; white-space: pre-line; }
        .modal-btn {
            background: var(--accent); color: white; border: none;
            padding: 12px; border-radius: 8px; cursor: pointer; width: 100%; font-size: 1.1rem; font-weight: bold;
        }

        .rankings-list { text-align: left; margin: 20px 0; }
        .rank-item { 
            padding: 12px; margin-bottom: 8px; background: #f8f9fa; 
            border-radius: 8px; display: flex; justify-content: space-between; align-items: center;
            font-weight: bold; font-size: 1.1rem;
        }
        .rank-1 { background: #ffd700; color: #333; border: 2px solid #e67e22; } 
        .rank-2 { background: #e0e0e0; color: #333; border: 2px solid #bdc3c7; } 
        .rank-3 { background: #cd7f32; color: #333; border: 2px solid #a0522d; } 
        .rank-loser { background: #fff; color: #333; border: 1px solid #ccc; } 
        
        .emoji-grid { 
            display: none; 
            position: absolute; 
            background: #fff; 
            border-radius: 8px; 
            padding: 10px; 
            z-index: 10000; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 8px; 
            box-shadow: 0 5px 20px rgba(0,0,0,0.5); 
            border: 2px solid #333;
        }
        .emoji-grid span { cursor: pointer; font-size: 1.8rem; text-align: center; padding: 5px; border-radius: 4px; }
        .emoji-grid span:hover { background: #eee; }

        /* --- MODO CELULAR (AJUSTES ESPECÍFICOS) --- */
        @media (max-width: 768px) {
            :root {
                /* Dado a la mitad de tamaño */
                --dice-size: 8vmin;
                --dice-half: 4vmin;
            }
            
            /* Botón 2 veces más chico */
            .btn-roll-float {
                padding: 4px 12px;
                font-size: 0.7rem;
                border-radius: 15px;
            }
            
            /* Emoji del jugador actual también más chico para proporción */
            .current-player-emoji {
                width: 30px;
                height: 30px;
                font-size: 1.2rem;
            }
        }

    </style>
</head>
<body>

    <div id="start-screen">
        <img src="logo.png" alt="LOGO" class="logo-img" onerror="this.style.display='none';">
        <button class="btn-beautiful" onclick="goToSetup()">JUGAR</button>
    </div>

    <div id="setup-screen">
        <h1>JUGADORES</h1>
        
        <div class="setup-headers">
            <div class="header-name">NOMBRES</div>
            <div class="header-emoji">PERSONAJES</div>
            <div class="header-bot"></div>
        </div>

        <div class="setup-container" id="players-setup"></div>
        
        <div class="player-select-container">
            <label style="display:block; margin-bottom: 8px; color:#ccc; font-size:0.8rem;">CANTIDAD DE JUGADORES</label>
            <select id="player-count" class="player-select" onchange="setup.renderPlayers()">
                <option value="2">2 JUGADORES</option>
                <option value="3">3 JUGADORES</option>
                <option value="4">4 JUGADORES</option>
                <option value="5">5 JUGADORES</option>
                <option value="6">6 JUGADORES</option>
            </select>
        </div>

        <button class="btn-beautiful" onclick="game.startFromSetup()">JUGAR</button>
    </div>

    <div id="game-screen">
        <button class="bgm-btn" id="bgm-btn" onclick="toggleBGM()">🔇</button>
        <button class="fullscreen-btn" id="fullscreen-btn" onclick="toggleFullScreen()">⛶ PANTALLA COMPLETA</button>

        <div class="board-wrapper" id="board-wrapper">
            <div class="placeholder-text" id="placeholder"></div>
            
            <div id="board-camera">
                <img id="board-image" src="tablero.png" alt="Tablero" onerror="this.src='https://via.placeholder.com/800x600?text=NO+SE+ENCONTRO+TABLERO.PNG';">
                <div id="tokens-container"></div>
            </div>
            
            <div id="ui-group" class="floating-ui">
                <div class="scene">
                    <div class="cube" id="cube">
                        <div class="cube__face cube__face--1"><div class="dot"></div></div>
                        <div class="cube__face cube__face--2"><div class="dot"></div><div class="dot"></div></div>
                        <div class="cube__face cube__face--3"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                        <div class="cube__face cube__face--4"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                        <div class="cube__face cube__face--5"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                        <div class="cube__face cube__face--6"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                    </div>
                </div>

                <div class="controls-bubble">
                    <div id="current-player-emoji" class="current-player-emoji">🐶</div>
                    <button class="btn-roll-float" id="roll-btn" onclick="game.humanRoll()">TIRAR</button>
                </div>
            </div>

        </div>
    </div>

    <div class="modal-overlay" id="results-modal">
        <div class="modal-content">
            <h2 class="modal-title" id="results-title">CLASIFICACIÓN</h2>
            <div id="rankings-container" class="rankings-list"></div>
            <button class="modal-btn" id="results-btn" onclick="location.reload()">JUGAR DE NUEVO</button>
        </div>
    </div>
    
    <div class="modal-overlay" id="event-modal">
        <div class="modal-content">
            <h2 class="modal-title" id="event-title">¡EVENTO!</h2>
            <p class="modal-text" id="event-msg">TEXTO</p>
            <button class="modal-btn" id="event-continue-btn">CONTINUAR</button>
        </div>
    </div>

    <div id="emoji-picker" class="emoji-grid"></div>

    <audio id="bgm-ambiente" src="ambiente.mp3" loop></audio>
    <audio id="bgm-ganador" src="ganador.mp3" loop></audio>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const bgmBtn = document.getElementById('bgm-btn');
        const bgmAmbiente = document.getElementById('bgm-ambiente');
        const bgmGanador = document.getElementById('bgm-ganador');
        const fsBtn = document.getElementById('fullscreen-btn');

        bgmAmbiente.volume = 0.3;
        bgmGanador.volume = 0.3;

        function toggleBGM() {
            const isAmbientePlaying = !bgmAmbiente.paused;
            const isGanadorPlaying = !bgmGanador.paused;

            if (isAmbientePlaying) {
                bgmAmbiente.pause();
                bgmBtn.innerText = "🔇";
            } else if (isGanadorPlaying) {
                bgmGanador.pause();
                bgmBtn.innerText = "🔇";
            } else {
                if (document.getElementById('results-modal').classList.contains('show')) {
                    bgmGanador.play();
                    bgmBtn.innerText = "🔊";
                } else {
                    bgmAmbiente.play();
                    bgmBtn.innerText = "🔊";
                }
            }
        }

        function goToSetup() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('setup-screen').style.display = 'flex';
            
            bgmGanador.pause();
            bgmGanador.currentTime = 0;
            
            bgmAmbiente.play().then(() => {
                bgmBtn.innerText = "🔊";
            }).catch(e => {
                bgmBtn.innerText = "🔇";
            });
        }

        function switchToWinnerMusic() {
            bgmAmbiente.pause();
            bgmGanador.currentTime = 0;
            bgmGanador.play().then(() => {
                bgmBtn.innerText = "🔊";
            }).catch(e => {
                bgmBtn.innerText = "🔇";
            });
        }
        
        const circusMelody = [
            1046.50, 987.77, 932.33, 987.77, 932.33, 880.00, 830.61, 783.99, 
            739.99, 783.99, 880.00, 830.61, 783.99, 880.00, 783.99, 739.99, 
            698.46, 659.25, 622.25, 659.25, 783.99, 698.46, 554.37, 587.33, 
            783.99, 698.46, 554.37, 587.33
        ];

        const sfx = {
            playTone: (freq, type, duration, vol = 0.1) => {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            },
            playCircusNote: (index) => {
                const note = circusMelody[index % circusMelody.length];
                sfx.playTone(note, 'triangle', 0.15, 0.08); 
            },
            dice: () => {
                let time = 0;
                while (time < 2000) {
                    setTimeout(() => {
                        sfx.playTone(100 + Math.random() * 50, 'square', 0.05, 0.08);
                    }, time);
                    time += 70; 
                }
                const gaps = [100, 150, 250, 500]; 
                gaps.forEach(gap => {
                    time += gap;
                    const isFinal = (time >= 3000);
                    const vol = isFinal ? 0.15 : 0.08;
                    const dur = isFinal ? 0.1 : 0.05;
                    const freq = isFinal ? 80 : (100 + Math.random() * 50);
                    setTimeout(() => {
                        sfx.playTone(freq, 'square', dur, vol);
                    }, time);
                });
            },
            prize: () => {
                sfx.playTone(523.25, 'triangle', 0.3, 0.1); 
                setTimeout(() => sfx.playTone(659.25, 'triangle', 0.3, 0.1), 50); 
                setTimeout(() => sfx.playTone(783.99, 'triangle', 0.4, 0.1), 100); 
            },
            punish: () => {
                sfx.playTone(100, 'sawtooth', 0.5, 0.2); 
                sfx.playTone(95, 'sawtooth', 0.5, 0.2);
            },
            win: () => {
                const winNotes = [523.25, 659.25, 783.99, 1046.50]; 
                winNotes.forEach((note, i) => {
                    setTimeout(() => sfx.playTone(note, 'triangle', 0.4, 0.2), i * 100);
                });
            }
        };

        const emojis = ["🐶", "🐱", "🐭", "🐹", "🐰", "🦊", "🐻", "🐼", "🐨", "🐯", "🦁", "🐮", "🐷", "🐸", "🐵", "🤖", "👽", "👻", "💀", "👾"];

        const boardConfig = {
            coordinates: [
                { x: 37.9, y: 81.3 },

        const rules = {

        const setup = {
            players: [],
            init: () => {
                setup.renderPlayers();
                setup.createEmojiPicker();
            },
            renderPlayers: () => {
                const count = parseInt(document.getElementById('player-count').value);
                const container = document.getElementById('players-setup');
                container.innerHTML = '';
                while(setup.players.length < count) {
                    setup.players.push({ name: `JUGADOR ${setup.players.length + 1}`, emoji: emojis[setup.players.length], isBot: false });
                }
                setup.players = setup.players.slice(0, count);
                setup.players.forEach((p, i) => {
                    const div = document.createElement('div');
                    div.className = 'player-config';
                    div.innerHTML = `
                        <input type="text" class="player-name-input" value="${p.name}" onchange="setup.updateName(${i}, this.value)">
                        <button class="emoji-btn" onclick="setup.openEmojiPicker(${i}, this)">${p.emoji}</button>
                        <button class="bot-toggle ${p.isBot ? 'active' : ''}" onclick="setup.toggleBot(${i}, this)">
                            ${p.isBot ? '🤖 BOT' : 'HUMANO'}
                        </button>
                    `;
                    container.appendChild(div);
                });
            },
            updateName: (index, newName) => {
                setup.players[index].name = newName.toUpperCase();
            },
            toggleBot: (index, btn) => {
                setup.players[index].isBot = !setup.players[index].isBot;
                setup.renderPlayers();
            },
            openEmojiPicker: (index, btn) => {
                const picker = document.getElementById('emoji-picker');
                picker.style.display = 'grid';
                picker.dataset.targetIndex = index;
                const rect = btn.getBoundingClientRect();
                picker.style.top = (rect.bottom + window.scrollY) + 'px';
                picker.style.left = (rect.left + window.scrollX) + 'px';
            },
            selectEmoji: (emoji) => {
                const index = document.getElementById('emoji-picker').dataset.targetIndex;
                setup.players[index].emoji = emoji;
                document.getElementById('emoji-picker').style.display = 'none';
                setup.renderPlayers();
            },
            createEmojiPicker: () => {
                const picker = document.getElementById('emoji-picker');
                emojis.forEach(e => {
                    const span = document.createElement('span');
                    span.innerText = e;
                    span.onclick = () => setup.selectEmoji(e);
                    picker.appendChild(span);
                });
                document.addEventListener('click', (e) => {
                    if(!e.target.closest('.emoji-btn') && !e.target.closest('#emoji-picker')) {
                        picker.style.display = 'none';
                    }
                });
            }
        };

        class Game {
            constructor() {
                this.players = [];
                this.currentPlayerIndex = 0;
                this.isAnimating = false;
                this.maxPos = 66;
                this.hasLoadedImage = false;
                this.finishedCount = 0;
                this.cubeRotX = 0;
                this.cubeRotY = 0;
                this.melodyIndex = 0;
                this.checkImage();
                window.addEventListener('resize', () => {
                    if(this.hasLoadedImage) {
                        this.fitBoardToScreen();
                    }
                });
            }

            checkImage() {
                const img = document.getElementById('board-image');
                const loadLogic = () => {
                    this.loadImageLogic(img);
                };
                if (img.complete) {
                    loadLogic();
                } else {
                    img.onload = loadLogic;
                }
                img.onerror = () => {
                    console.warn("No se pudo cargar tablero.png, intentando recargar en 1s...");
                    setTimeout(this.checkImage.bind(this), 1000);
                };
            }

            fitBoardToScreen() {
                const img = document.getElementById('board-image');
                const wrapper = document.getElementById('board-wrapper');
                if (!img || !img.naturalWidth) return;

                const imgRatio = img.naturalWidth / img.naturalHeight;
                const winW = window.innerWidth;
                const winH = window.innerHeight;

                const availableH = winH - 20; 

                let wrapperW, wrapperH;

                wrapperW = winW;
                wrapperH = wrapperW / imgRatio;

                if (wrapperH > availableH) {
                    wrapperH = availableH;
                    wrapperW = wrapperH * imgRatio;
                }

                wrapper.style.width = `${wrapperW}px`;
                wrapper.style.height = `${wrapperH}px`;
            }

            startFromSetup() {
                this.players = setup.players.map((p, i) => ({
                    id: i,
                    name: p.name,
                    emoji: p.emoji,
                    isBot: p.isBot,
                    pos: 0,
                    waitTurns: 0,
                    visitedRules: [],
                    element: null,
                    offsetX: (Math.random() - 0.5) * 2,
                    offsetY: (Math.random() - 0.5) * 2,
                    finishOrder: null
                }));
                const tokensContainer = document.getElementById('tokens-container');
                tokensContainer.innerHTML = '';
                this.players.forEach(p => {
                    const el = document.createElement('div');
                    el.className = 'token';
                    el.innerText = p.emoji;
                    tokensContainer.appendChild(el);
                    p.element = el;
                });

                document.getElementById('setup-screen').style.display = 'none';
                document.getElementById('game-screen').style.display = 'flex';

                if(this.hasLoadedImage) {
                    this.updateTokensUI();
                    this.checkBotTurn();
                }
            }

            loadImageLogic(img) {
                img.style.display = 'block';
                document.getElementById('placeholder').style.display = 'none';
                
                this.fitBoardToScreen();

                const uiGroup = document.getElementById('ui-group');
                uiGroup.style.display = 'flex';
                uiGroup.style.left = uiConfig.group.x + '%';
                uiGroup.style.top = uiConfig.group.y + '%';
                
                this.hasLoadedImage = true;
                document.querySelectorAll('.token').forEach(t => t.style.display = 'block');
                
                this.updateTokensUI();
                
                if(this.players.length) this.checkBotTurn();
                else setup.init();
            }

            async humanRoll() {
                if(this.isAnimating) return;
                const player = this.players[this.currentPlayerIndex];
                if(player.isBot || player.finishOrder !== null) return;
                await this.executeTurn(player);
            }

            async checkBotTurn() {
                if(this.isAnimating) return;
                const player = this.players[this.currentPlayerIndex];
                if(player.finishOrder !== null) {
                    this.nextTurn();
                    return;
                }
                
                const indicator = document.getElementById('current-player-emoji');
                if(indicator) indicator.innerText = player.emoji;

                if(player.isBot) {
                    document.getElementById('roll-btn').disabled = true;
                    await this.wait(1500);
                    await this.executeTurn(player);
                } else {
                    document.getElementById('roll-btn').disabled = false;
                    document.getElementById('roll-btn').innerText = "TIRAR";
                }
            }

            async executeTurn(player) {
                this.isAnimating = true;
                if (player.waitTurns > 0) {
                    await this.showEventModal("TURNO PERDIDO", `${player.name} CUMPLE CASTIGO (${player.waitTurns} RESTANTES).`, player);
                    player.waitTurns--;
                    this.nextTurn();
                    return;
                }
                const diceResult = Math.floor(Math.random() * 6) + 1;
                this.animateDice(diceResult); 
                await this.wait(3000); 
                
                this.zoomToPlayer(player);
                await this.wait(800);

                let forwardPos = player.pos + diceResult;

                if (forwardPos > this.maxPos) {
                    await this.movePlayerStepByStep(player, this.maxPos);
                    await this.wait(400);
                    const excess = forwardPos - this.maxPos;
                    const reboundPos = this.maxPos - excess;
                    await this.movePlayerStepByStep(player, reboundPos);
                } else {
                    await this.movePlayerStepByStep(player, forwardPos);
                }

                const extraTurn = await this.checkSquareRules(player, player.pos);
                
                if (!extraTurn) {
                    await this.wait(2000);
                    this.resetCamera();
                }

                if (player.pos === this.maxPos) {
                    this.handleFinish(player);
                } else {
                    if (!extraTurn) {
                        this.nextTurn();
                    } else {
                        this.isAnimating = false;
                        await this.showEventModal("¡TIRÁS DE NUEVO!", `¡${player.name} TIENE OTRO TURNO!`, player);
                        this.checkBotTurn(); 
                    }
                }
            }

            zoomToPlayer(player) {
                const camera = document.getElementById('board-camera');
                const uiGroup = document.getElementById('ui-group');
                const wrapper = document.getElementById('board-wrapper');
                const coords = boardConfig.coordinates[player.pos];
                
                if(!coords || !camera || !wrapper) return;

                uiGroup.style.opacity = '0';
                uiGroup.style.visibility = 'hidden';

                const w = wrapper.clientWidth;
                const h = wrapper.clientHeight;

                const cx = w / 2;
                const cy = h / 2;

                const realXPercent = coords.x + player.offsetX;
                const realYPercent = coords.y + player.offsetY;

                const px = (realXPercent / 100) * w;
                const py = (realYPercent / 100) * h;

                const dx = px - cx;
                const dy = py - cy;

                const scale = 2.2;

                const tx = -dx * scale;
                const ty = -dy * scale;

                camera.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
            }

            resetCamera() {
                const camera = document.getElementById('board-camera');
                const uiGroup = document.getElementById('ui-group');
                
                if(camera) camera.style.transform = `translate(0px, 0px) scale(1)`;
                
                if(uiGroup) {
                    uiGroup.style.visibility = 'visible';
                    uiGroup.style.opacity = '1';
                }
            }

            async movePlayerStepByStep(player, targetPos) {
                const direction = targetPos > player.pos ? 1 : -1;
                player.element.classList.remove('frozen');
                this.players.forEach(p => {
                    if(p.id !== player.id) p.element.classList.add('frozen');
                });
                while (player.pos !== targetPos) {
                    player.pos += direction;
                    this.updateTokensUI();
                    
                    this.zoomToPlayer(player);
                    
                    sfx.playCircusNote(this.melodyIndex);
                    this.melodyIndex++;
                    
                    await this.wait(300);
                }
                this.players.forEach(p => p.element.classList.remove('frozen'));
            }

            animateDice(value) {
                sfx.dice(); 
                const cube = document.getElementById('cube');
                
                let targetX = 0;
                let targetY = 0;

                switch(value) {
                    case 1: targetX = 0;   targetY = 0; break;
                    case 2: targetX = 0;   targetY = -90; break;
                    case 3: targetX = 0;   targetY = -180; break;
                    case 4: targetX = 0;   targetY = 90; break;
                    case 5: targetX = -90; targetY = 0; break;
                    case 6: targetX = 90;  targetY = 0; break;
                }

                const spins = 5;
                const extraX = (spins * 360); 
                const extraY = (spins * 360);

                this.cubeRotX += extraX + (targetX - (this.cubeRotX % 360));
                this.cubeRotY += extraY + (targetY - (this.cubeRotY % 360));

                // Usamos CSS Variable para que responda al Media Query
                cube.style.transform = `translateZ(calc(var(--dice-half) * -1)) rotateX(${this.cubeRotX}deg) rotateY(${this.cubeRotY}deg)`;
            }

            handleFinish(player) {
                this.finishedCount++;
                player.finishOrder = this.finishedCount;
                player.element.classList.add('finished');
                sfx.win();
                
                switchToWinnerMusic();

                let gameOver = false;
                if (this.players.length === 2) {
                    gameOver = true;
                } else {
                    if (this.finishedCount >= this.players.length - 1) {
                        gameOver = true;
                    }
                }
                
                this.showResults(gameOver);

                if (!gameOver) {
                    this.isAnimating = false;
                    this.nextTurn();
                }
            }

            showResults(isGameOver) {
                const maxRank = this.players.length;
                const playersWithRank = this.players.map(p => ({
                    ...p,
                    finishOrder: p.finishOrder || maxRank 
                }));
                const sortedPlayers = playersWithRank.sort((a, b) => a.finishOrder - b.finishOrder);
                const container = document.getElementById('rankings-container');
                const title = document.getElementById('results-title');
                const btn = document.getElementById('results-btn');

                container.innerHTML = '';
                sortedPlayers.forEach((p) => {
                    const div = document.createElement('div');
                    let rankClass = 'rank-loser';
                    if (p.finishOrder === 1) rankClass = 'rank-1';
                    else if (p.finishOrder === 2) rankClass = 'rank-2';
                    else if (p.finishOrder === 3) rankClass = 'rank-3';
                    div.className = `rank-item ${rankClass}`;
                    div.innerHTML = `
                        <span>${p.finishOrder}. ${p.name} ${p.emoji}</span>
                        <span>${p.finishOrder}º LUGAR</span>
                    `;
                    container.appendChild(div);
                });
                
                document.getElementById('results-modal').classList.add('show');

                if (isGameOver) {
                    title.innerText = "🏆 JUEGO TERMINADO";
                    btn.innerText = "JUGAR DE NUEVO";
                    btn.onclick = () => location.reload();
                } else {
                    title.innerText = "🏆 CLASIFICACIÓN ACTUAL";
                    btn.innerText = "CONTINUAR JUEGO";
                    
                    const newBtn = btn.cloneNode(true);
                    btn.parentNode.replaceChild(newBtn, btn);
                    
                    newBtn.onclick = () => {
                        document.getElementById('results-modal').classList.remove('show');
                        this.resetCamera(); 
                    };
                }
            }

            async checkSquareRules(player, pos) {
                if (rules[pos]) {
                    const rule = rules[pos];
                    if (rule.once) {
                        if (player.visitedRules.includes(pos)) {
                            await this.wait(500);
                            await this.showEventModal("¡LIBRE!", `YA HABÍAS PASADO POR LA CASILLA ${pos}. ¡NO PASA NADA!`, player);
                            return false;
                        } else {
                            player.visitedRules.push(pos);
                        }
                    }
                    await this.wait(500);
                    if (rule.type === 'jail' || (rule.type === 'move' && rule.value < 0)) {
                        sfx.punish();
                    } else {
                        sfx.prize();
                    }
                    const parts = rule.msg.split('👉');
                    const displayText = parts.join('\n\n'); 
                    await this.showEventModal("CASILLA " + pos, displayText, player);
                    if (rule.type === 'move') {
                        const target = pos + rule.value;
                        const safeTarget = Math.max(0, Math.min(target, this.maxPos));
                        await this.movePlayerStepByStep(player, safeTarget);
                        return false;
                    } else if (rule.type === 'jail') {
                        player.waitTurns = rule.turns;
                        return false;
                    } else if (rule.type === 'extra_turn') {
                        return true;
                    }
                }
                return false;
            }

            showEventModal(title, msg, player) {
                this.resetCamera();

                return new Promise(resolve => {
                    const modal = document.getElementById('event-modal');
                    document.getElementById('event-title').innerText = title;
                    document.getElementById('event-msg').innerText = msg;
                    const btn = document.getElementById('event-continue-btn');
                    const newBtn = btn.cloneNode(true);
                    btn.parentNode.replaceChild(newBtn, btn);
                    
                    let resolved = false; 

                    const closeModal = () => {
                        if (resolved) return;
                        resolved = true;
                        modal.classList.remove('show');
                        resolve();
                    };

                    newBtn.addEventListener('click', closeModal);
                    modal.classList.add('show');

                    if (player && player.isBot) {
                        setTimeout(() => {
                            closeModal();
                        }, 2000); 
                    }
                });
            }

            updateTokensUI() {
                this.players.forEach(p => {
                    const coords = boardConfig.coordinates[p.pos];
                    if (coords && p.element) {
                        p.element.style.left = `calc(${coords.x}% + ${p.offsetX}%)`;
                        p.element.style.top = `calc(${coords.y}% + ${p.offsetY}%)`;
                        p.element.style.display = 'block';
                    }
                });
            }

            nextTurn() {
                this.currentPlayerIndex = (this.currentPlayerIndex + 1) % this.players.length;
                this.isAnimating = false;
                this.checkBotTurn();
            }

            wait(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }
        }

        const game = new Game();
        setup.init();

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.log(err));
                fsBtn.style.display = 'none';
            } else {
                document.exitFullscreen();
                fsBtn.style.display = 'block';
            }
        }

        document.addEventListener('fullscreenchange', () => {
            if (document.fullscreenElement) {
                fsBtn.style.display = 'none';
            } else {
                fsBtn.style.display = 'block';
            }
        });
    </script>
